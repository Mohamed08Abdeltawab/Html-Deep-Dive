<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optimized Images Example</title>
    
    <style>
        /* Separating CSS from HTML is a best practice */
        .responsive-img {
            width: 25%;
            height: auto;
        }
        
        .gallery {
            margin-top: 20px;
        }
    </style>
</head>
<body>


h1>Responsive Image Example using srcset</h1>
    <img src="Images/default-image.jpg"
         srcset="Images/small-image.jpg 500w,
                 Images/medium-image.jpg 1000w,
                 Images/large-image.jpg 1500w"
         sizes="(max-width: 600px) 480px,
                (max-width: 900px) 800px,
                1200px"
         alt="Responsive Image">
    <p>This image uses the srcset attribute to load different image sizes based on the viewport width.</p>


    
    <!-- 1. Above the Fold Image: Loads immediately -->
    <h2>Main Profile</h2>
    <img 
        src="Images/Profile.jpeg" 
        alt="Main Profile Picture" 
        title="Profile Picture" 
        width="200" 
        height="200" 
        loading="eager" 
    >
    <br>
    <img 
        src="Images/Profile.jpeg" 
        alt="Main Profile Picture" 
        title="Profile Picture" 
        width="200" 
        height="200" 
        loading="eager" 
    >
    <br>


    <!-- 1. Above the fold image (Loads immediately) -->
    <h1>Profile Overview</h1>
    <img 
        src="Images/Profile.jpeg" 
        alt="Profile Picture" 
        width="150" 
        height="150" 
        loading="eager"
    >

    <hr>

    <!-- 2. Embedded Video Frame (Lazy loaded) -->
    <h2>Featured Content</h2>
    <iframe 
        src="https://www.youtube.com/embed/VIDEO_ID" 
        width="560" 
        height="315" 
        title="Featured Video"
        loading="auto"
    ></iframe>

    
    <img 
        src="Images/Profile.jpeg" 
        alt="Main Profile Picture" 
        title="Profile Picture" 
        width="200" 
        height="200" 
        loading="eager" 
    >
    <br>
    <img 
        src="Images/Profile.jpeg" 
        alt="Main Profile Picture" 
        title="Profile Picture" 
        width="200" 
        height="200" 
        loading="eager" 
    >
    <hr>

    <!-- 2. Below the Fold Images: Lazy loaded to save bandwidth -->
    <div class="gallery">
        <h2>Thumbnail Gallery</h2>
        
        <img src="Images/Profile.jpeg" alt="Thumbnail Small 1" title="Thumbnail" width="50" height="50" loading="lazy">
        <br>
        
        <img src="Images/Profile.jpeg" alt="Thumbnail Medium 1" title="Thumbnail" width="100" height="100" loading="lazy">
        <br>
        
        <img src="Images/Profile.jpeg" alt="Thumbnail Medium 2" title="Thumbnail" width="100" height="100" loading="lazy">
        <br>
        
        <img src="Images/Profile.jpeg" alt="Thumbnail Small 2" title="Thumbnail" width="50" height="50" loading="lazy">
        <br>
        <img src="Images/Profile.jpeg" alt="Thumbnail Small 1" title="Thumbnail" width="50" height="50" loading="lazy">
        <br>
        
        <img src="Images/Profile.jpeg" alt="Thumbnail Medium 1" title="Thumbnail" width="100" height="100" loading="lazy">
        <br>
        
        <img src="Images/Profile.jpeg" alt="Thumbnail Medium 2" title="Thumbnail" width="100" height="100" loading="lazy">
        <br>
        
        <img src="Images/Profile.jpeg" alt="Thumbnail Small 2" title="Thumbnail" width="50" height="50" loading="lazy">
        <br>
        <img src="Images/Profile.jpeg" alt="Thumbnail Small 1" title="Thumbnail" width="50" height="50" loading="lazy">
        <br>
        
        <img src="Images/Profile.jpeg" alt="Thumbnail Medium 1" title="Thumbnail" width="100" height="100" loading="lazy">
        <br>
        
        <img src="Images/Profile.jpeg" alt="Thumbnail Medium 2" title="Thumbnail" width="100" height="100" loading="lazy">
        <br>
        
        <img src="Images/Profile.jpeg" alt="Thumbnail Small 2" title="Thumbnail" width="50" height="50" loading="lazy">
        <br>
        <img src="Images/Profile.jpeg" alt="Thumbnail Small 1" title="Thumbnail" width="50" height="50" loading="lazy">
        <br>
        
    </div>

    <hr>
    
    <!-- 3. Responsive Image using CSS class instead of inline styles -->
    <h2>Responsive Profile</h2>
    <img 
        src="Images/Profile.jpeg" 
        alt="Responsive Profile Picture" 
        title="Profile Picture" 
        class="responsive-img"
        width="400" 
        height="400" 
        loading="lazy"
    >
    <br>
    <img 
        src="Images/Profile.jpeg" 
        alt="Responsive Profile Picture" 
        title="Profile Picture" 
        class="responsive-img"
        width="400" 
        height="400" 
        loading="lazy"
    >
    <br>
    <img 
        src="Images/Profile.jpeg" 
        alt="Responsive Profile Picture" 
        title="Profile Picture" 
        class="responsive-img"
        width="400" 
        height="400" 
        loading="lazy"
    >
    <br>

</body>
</html>
